# Source of truth for epics.md, sprint-status.yaml, and Benji sync.
# Render with: python3 ~/Public/domain-buildplans/scripts/epics_render.py <this file>
# Sync with:   node ~/Public/domain-buildplans/scripts/benji/benji_sync.mjs <this file>
#
# Add a story here, then render + sync. Benji list is Products -> Omarchy Plugins -> Tinkerer Club.
project: omarchy-plugin-tinkerer-club
project_name: Tinkerer Club Omarchy Plugin
benji:
  list_name: Tinkerer Club
  list_id: b62ffd88-0c45-487b-a040-41bb826fb3df
  task_type: personal
  project_prefix: "Tinkerer Club "
mvp_epics: [0, 1]
epics:
  - num: 0
    title: Plugin Foundation
    emoji: "🏗️"
    source: repo scaffold 2026-09-14
    goal: Public installable Omarchy plugin, BMAD tracking, and Benji wiring so new stories have a place to land.
    why: Nothing else ships until the plugin validates, installs, and has a writeable epic/sprint/Benji loop.
    dependencies: none
    notes: Repo, BMAD install, and local enable already landed. Edit this YAML, not epics.md.
    stories:
      - id: "0.1"
        slug: public-repo-and-manifest
        title: Public repo and installable manifest
        as: developer
        want: a public GitHub repo with a valid Omarchy manifest, bar widget, panel, and helper
        so: anyone can install with omarchy plugin add
        ac:
          - "Given the repo root, When omarchy plugin validate . runs, Then the manifest and entry points pass"
          - "Given https://github.com/dneighbors/omarchy-plugin-tinkerer-club.git, When a user runs omarchy plugin add with --enable, Then dneighbors.tinkerer-club appears on the bar"
      - id: "0.2"
        slug: bmad-method-install
        title: BMAD Method install
        as: developer
        want: BMAD Method installed with Cursor and Claude Code skills
        so: planning and implementation use the same workflows as other repos
        ac:
          - "Given the repo, When npx bmad-method@latest status runs, Then core and bmm 6.12.0 are present"
          - "Given _bmad/bmm/config.yaml, When read, Then user_name is Derek and user_skill_level is advanced"
      - id: "0.3"
        slug: bmad-benji-tracking
        title: Epics, sprint status, and Benji list
        as: developer
        want: epics.source.yaml rendered to epics.md and sprint-status.yaml, synced to Benji
        so: new stories can be written and linked to tasks under Products -> Omarchy Plugins -> Tinkerer Club
        ac:
          - "Given Products, When Omarchy Plugins and Tinkerer Club lists exist, Then Tinkerer Club is nested under Omarchy Plugins"
          - "Given epics.source.yaml, When epics_render.py and benji_sync.mjs run, Then epics.md, sprint-status.yaml, and docs/benji-map.yaml contain Benji project and todo ids"
      - id: "0.4"
        slug: member-api-key-file
        title: Member API key file and helper status
        as: member
        want: the helper to read a local API key file and report configured or not without printing the key
        so: the panel can tell me to add a key and never leak it
        ac:
          - "Given ~/.config/omarchy/secrets/tinkerer-club-api-key is missing, When bin/tinkerer status runs, Then configured is false and the path is in the hint"
          - "Given a readable key file, When bin/tinkerer status runs, Then configured is true and the key is not printed"

  - num: 1
    title: Club Feed
    emoji: "🦞"
    source: OpenAPI post.timeline; Raycast extension contract
    goal: Signed-in members see recent Tinkerer Club posts from the Omarchy bar and can open them in the browser.
    why: The feed is the first thing people come back for. Same API as the Raycast extension.
    dependencies: "0"
    notes: post.timeline is POST /api/v1/post/timeline with x-api-key.
    stories:
      - id: "1.1"
        slug: timeline-fetch
        title: Fetch the member timeline
        as: member
        want: bin/tinkerer feed to call post.timeline and return normalized posts
        so: the panel can render a list without holding the key
        ac:
          - "Given a valid key file, When bin/tinkerer feed runs, Then it POSTs to /api/v1/post/timeline and prints ok true with posts"
          - "Given a 401, When feed runs, Then the JSON error tells me to check the key file"
      - id: "1.2"
        slug: panel-feed-list
        title: Panel feed list
        as: member
        want: the bar panel to list recent posts with author, snippet, and age
        so: I can scan the club without opening a browser first
        ac:
          - "Given a configured key, When I open the panel, Then recent posts render"
          - "Given a post row, When I click it, Then the post URL opens in the browser"
      - id: "1.3"
        slug: new-activity-dot
        title: New activity dot
        as: member
        want: a bar dot when a newer post arrives after I last opened the panel
        so: I know the club moved without staring at it
        ac:
          - "Given a newer latestId than seenId, When the panel is closed, Then the bar shows a dot"
          - "Given I open the panel, When the feed loads, Then the dot clears"
      - id: "1.4"
        slug: feed-refresh-and-errors
        title: Feed refresh and errors
        as: member
        want: a refresh action and readable errors when the API fails
        so: a dead key or network blip does not look like an empty club
        ac:
          - "Given the panel is open, When I click Refresh, Then the feed reloads"
          - "Given an API error, When the helper returns ok false, Then the panel shows the error and hint"

  - num: 2
    title: Notifications
    emoji: "🔔"
    source: OpenAPI notification.*
    goal: Unread club notifications on the bar, with a list and mark-read.
    why: The feed is what happened. Notifications are what wants you.
    dependencies: "0, 1"
    stories:
      - id: "2.1"
        slug: unread-count
        title: Unread notification count
        as: member
        want: the helper and bar to show notification.unreadCount
        so: I can see if the club is waiting on me
        ac:
          - "Given a valid key, When bin/tinkerer notifications unread runs, Then it returns a count"
          - "Given an unread count greater than zero, When the bar is idle, Then the widget shows that count or a badge"
      - id: "2.2"
        slug: notification-list
        title: Notification list
        as: member
        want: the panel to list notification.list items
        so: I can read them without leaving the bar
        ac:
          - "Given notifications exist, When I open the notifications view, Then sender, title, and age are listed"
          - "Given a notification with a target URL, When I click it, Then the browser opens that URL"
      - id: "2.3"
        slug: mark-read
        title: Mark notifications read
        as: member
        want: markRead and markAllRead from the panel
        so: the badge matches what I have already seen
        ac:
          - "Given an unread item, When I mark it read, Then unreadCount drops"
          - "Given Mark all read, When it succeeds, Then the badge clears"

  - num: 3
    title: Events
    emoji: "📅"
    source: OpenAPI event.calendar, event.liveBanner
    goal: Upcoming club events and a live banner when something is happening now.
    why: Calls and live sessions are the other half of the club.
    dependencies: "0"
    stories:
      - id: "3.1"
        slug: upcoming-events
        title: Upcoming events
        as: member
        want: event.calendar in the panel
        so: I can see what is next without opening the site
        ac:
          - "Given upcoming events, When I open the events view, Then title, time, and link are listed"
      - id: "3.2"
        slug: live-banner
        title: Live event banner
        as: member
        want: event.liveBanner on the bar or panel when a session is live
        so: I do not miss a call that is already going
        ac:
          - "Given a live event, When liveBanner returns one, Then the panel shows it and a click opens the event"

  - num: 4
    title: Ops Hygiene
    emoji: "🧹"
    source: portfolio convention (RevivaGo Epic 58)
    goal: Standing place for bugs, chores, and marketplace listing work.
    why: Small fixes should not invent a new epic every time.
    dependencies: none
    stories:
      - id: "4.1"
        slug: standing-chores
        title: Standing chores container
        as: developer
        want: this epic ready for one-off bugs and marketplace submission
        so: chores have a Benji project without a new epic each time
        ac:
          - "Given a plugin bug or marketplace task, When it is added here, Then it gets a story in this YAML and a Benji todo after sync"
